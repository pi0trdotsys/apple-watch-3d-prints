<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AW44 · druk 3D dla Apple Watch</title>
<meta name="description" content="Interaktywny podgląd 3D: brelok z ładowaniem i obudowa w stylu iPoda classic dla Apple Watch 44 mm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0B0D; --panel: rgba(12, 14, 17, 0.82); --line: #1E2228; --line2: #313741;
    --text: #E8EAED; --muted: #8A9099; --dim: #5B616B; --accent: #4FD1FF;
    --mono: "JetBrains Mono", "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); overflow: hidden; }
  #scena, #wymiary { position: fixed; inset: 0; }
  #scena canvas { display: block; }
  #wymiary { pointer-events: none; z-index: 1; }
  #wymiary line { stroke: var(--accent); stroke-width: 1; }
  #wymiary line.pom { stroke: var(--dim); stroke-dasharray: 2 3; }
  #wymiary text { font-family: var(--mono); font-size: 11px; fill: var(--accent); letter-spacing: .06em; }
  .ui { position: fixed; z-index: 2; }
  button, a.btn { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); background: rgba(10, 11, 13, .55); border: 1px solid var(--line); padding: 8px 12px;
    cursor: pointer; border-radius: 2px; text-decoration: none; transition: color .15s, border-color .15s; }
  button:hover, a.btn:hover { color: var(--text); border-color: var(--line2); }
  button.on { color: var(--accent); border-color: var(--accent); }
  #gora { top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
    padding: 18px 24px; gap: 12px 20px; flex-wrap: wrap; }
  .marka { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .marka b { color: var(--text); font-weight: 700; letter-spacing: .28em; margin-right: 12px; }
  .marka i { color: var(--accent); font-style: normal; }
  nav { display: flex; gap: 4px; align-items: center; }
  nav .nr { color: var(--dim); margin-right: 8px; }
  nav button.on .nr { color: var(--accent); }
  #karta { left: 24px; bottom: 24px; width: min(390px, calc(100vw - 48px)); background: var(--panel);
    border: 1px solid var(--line); padding: 18px 20px 16px; backdrop-filter: blur(8px); }
  #karta::before, #karta::after { content: ""; position: absolute; width: 10px; height: 10px; border: 1px solid var(--accent); }
  #karta::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  #karta::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .kod { font-size: 11px; color: var(--accent); letter-spacing: .24em; text-transform: uppercase; }
  #karta h1 { font-size: 17px; font-weight: 500; letter-spacing: .04em; margin: 8px 0 6px; }
  #karta p { font-size: 12px; color: var(--muted); line-height: 1.65; margin: 0 0 14px; }
  #karta dl { display: grid; grid-template-columns: auto 1fr; gap: 7px 18px; margin: 0 0 14px; font-size: 11.5px; }
  #karta dt { color: var(--dim); letter-spacing: .14em; text-transform: uppercase; }
  #karta dd { margin: 0; color: var(--text); }
  #karta .linki { display: flex; gap: 6px; flex-wrap: wrap; }
  #sterowanie { right: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .grupa { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .grupa .etyk { font-size: 10px; color: var(--dim); letter-spacing: .18em; text-transform: uppercase; align-self: center; margin-right: 6px; }
  #podpowiedz { left: 50%; transform: translateX(-50%); bottom: 8px; font-size: 10px; color: var(--dim);
    letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
  #etykieta { display: none; }
  #blad { display: none; position: fixed; inset: 0; z-index: 5; align-items: center; justify-content: center;
    font-size: 12px; color: var(--muted); letter-spacing: .1em; text-align: center; padding: 24px; }
  body.studio .ui { display: none !important; }
  body.studio #etykieta { display: block; position: fixed; left: 40px; top: 34px; z-index: 2; }
  #etykieta .nazwa { font-size: 22px; font-weight: 500; letter-spacing: .03em; margin: 10px 0 8px; }
  #etykieta .spec { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  @media (max-width: 820px) {
    #gora { padding: 12px 14px; }
    #karta { left: 12px; right: 12px; width: auto; bottom: auto; top: 96px; padding: 12px 14px; }
    #karta p, #karta dl dt:nth-of-type(n+4), #karta dl dd:nth-of-type(n+4) { display: none; }
    #sterowanie { left: 12px; right: 12px; bottom: 14px; align-items: stretch; }
    .grupa { justify-content: flex-start; }
    #podpowiedz { display: none; }
  }
</style>
</head>
<body>
<div id="scena"></div>
<svg id="wymiary" xmlns="http://www.w3.org/2000/svg"></svg>
<header id="gora" class="ui">
  <div class="marka"><b>AW44</b>druk 3D <i>·</i> Apple Watch 44 mm</div>
  <nav id="modele">
    <button data-model="brelok"><span class="nr">01</span>brelok</button>
    <button data-model="ipod"><span class="nr">02</span>ipod</button>
    <a class="btn" id="repo" target="_blank" rel="noopener">repo ↗</a>
  </nav>
</header>
<section id="karta" class="ui"></section>
<div id="sterowanie" class="ui">
  <div class="grupa" id="przelaczniki"></div>
  <div class="grupa" id="kamery"><span class="etyk">widok</span></div>
</div>
<div id="podpowiedz" class="ui">przeciągnij — obrót · scroll — zoom · prawy przycisk — przesunięcie</div>
<div id="etykieta"></div>
<div id="blad"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="dane_brelok.js"></script>
<script src="dane_ipod.js"></script>
<script>
const REPO = 'https://github.com/pi0trdotsys/apple-watch-3d-prints';
const fmt = v => (Math.round(v * 10) / 10).toFixed(1).replace('.', ',').replace(',0', '');
const KONFIG = {
  brelok: {
    kod: '01', skrot: 'brelok', nazwa: 'Brelok z ładowaniem',
    opis: 'Ramka z oczkiem na klucze. Tył zostaje otwarty, więc krążek ładowarki przyczepia się bez wyjmowania zegarka.',
    cel: [0, -1, 5.5], podloga: -45,
    kamery: { iso: [132, 78, 168], przod: [0, -1, 235], tyl: [0, -1, -225], bok: [235, -1, 5.5], tyl34: [-132, 70, -168] },
    czesci: {
      TPU:       { typ: 'ramka', wariant: 'TPU',  kolor: 0xD9D9D5, rough: 0.62, metal: 0.0 },
      PETG:      { typ: 'ramka', wariant: 'PETG', kolor: 0xD9D9D5, rough: 0.5,  metal: 0.0 },
      zegarek:   { typ: 'zegarek',   kolor: 0x2B2D31, rough: 0.32, metal: 0.55 },
      ladowarka: { typ: 'ladowarka', kolor: 0xE4E4E1, rough: 0.35, metal: 0.05 },
    },
    przelaczniki: ['zegarek', 'ladowarka', 'wariant', 'przekroj', 'wymiary'],
    spec(r, s) {
      const v = r[s.wariant], w = v['wymiary [mm]'];
      return [
        ['wymiary', `${fmt(w[0])} × ${fmt(w[1])} × ${fmt(w[2])} mm`],
        ['masa', `≈ ${fmt(v['waga [g]'])} g`],
        ['materiał', s.wariant === 'TPU' ? 'TPU 95A · elastyczny' : 'PETG · sztywny (test)'],
        ['ładowanie', 'otwarty tył · krążek Ø 27,7 mm'],
        ['dostęp', 'ekran · koronka · przycisk · głośnik'],
        ['kontrola', `0 kolizji · luz do ładowarki ${fmt(v['min. odstep od ladowarki [mm]'])} mm`],
      ];
    },
    linia(r, s) { const w = r[s.wariant]['wymiary [mm]']; return `${fmt(w[0])} × ${fmt(w[1])} × ${fmt(w[2])} mm · ${s.wariant === 'TPU' ? 'TPU 95A' : 'PETG'} · 1 część`; },
  },
  ipod: {
    kod: '02', skrot: 'ipod', nazwa: 'iPod z Apple Watcha',
    opis: 'Obudowa w proporcjach iPoda classic. Zegarek jest ekranem, koronką kręcisz pokrętłem z boku, a ładowarka przyczepia się przez okno w klapce.',
    cel: [0, -28, 5.5], podloga: -75,
    kamery: { iso: [172, 62, 270], przod: [0, -28, 390], tyl: [0, -28, -380], bok: [390, -28, 5.5], tyl34: [-172, 52, -270] },
    czesci: {
      korpus:     { typ: 'ramka',     kolor: 0xDCDCD8, rough: 0.5,  metal: 0.0,  ex: [0, 0, 0] },
      klapka:     { typ: 'klapka',    kolor: 0xC6CAD0, rough: 0.34, metal: 0.28, ex: [0, 0, -44] },
      kolko:      { typ: 'czesc',     kolor: 0xC4C5C1, rough: 0.5,  metal: 0.0,  ex: [0, 0, -14] },
      popychacz:  { typ: 'czesc',     kolor: 0xB8BCC2, rough: 0.45, metal: 0.1,  ex: [16, 0, -6] },
      przedluzka: { typ: 'czesc',     kolor: 0x1D1E21, rough: 0.8,  metal: 0.0,  ex: [13, 0, -6] },
      pokretlo:   { typ: 'czesc',     kolor: 0xB8BCC2, rough: 0.4,  metal: 0.2,  ex: [28, 0, 0] },
      zegarek:    { typ: 'zegarek',   kolor: 0x2B2D31, rough: 0.32, metal: 0.55, ex: [0, 0, -27] },
      ladowarka:  { typ: 'ladowarka', kolor: 0xF4F4F2, rough: 0.35, metal: 0.05, ex: [0, 0, -58] },
    },
    przelaczniki: ['zegarek', 'ladowarka', 'klapka', 'rozloz', 'przekroj', 'wymiary'],
    spec(r) {
      const k = r.kontrola, w = k['wymiary obudowy [mm]'];
      return [
        ['wymiary', `${fmt(w[0])} × ${fmt(w[1])} × ${fmt(w[2])} mm`],
        ['części', '5 + przedłużka koronki z TPU'],
        ['plastik', '≈ 40–45 g przy 15–20 % wypełnienia'],
        ['ładowanie', 'okno Ø 33 mm w klapce'],
        ['koronka', 'pokrętło z boku · obrót i wciśnięcie'],
        ['montaż', '4 × wkręt M2×6'],
        ['kontrola', `0 kolizji · luz do ładowarki ${fmt(k['odstep ladowarka-klapka [mm]'])} mm`],
      ];
    },
    linia(r) { const w = r.kontrola['wymiary obudowy [mm]']; return `${fmt(w[0])} × ${fmt(w[1])} × ${fmt(w[2])} mm · PLA + TPU · 6 części`; },
  },
};
const NAZWY = { zegarek: 'zegarek', ladowarka: 'ładowarka', klapka: 'klapka', rozloz: 'rozłóż', przekroj: 'przekrój', wymiary: 'wymiary' };
const KAMERY = { iso: '3/4', przod: 'przód', tyl: 'tył', bok: 'bok' };

const blad = msg => { const b = document.getElementById('blad'); b.textContent = msg; b.style.display = 'flex'; };
if (!window.THREE || !THREE.OrbitControls || !THREE.STLLoader) blad('Nie udało się wczytać three.js z CDN — sprawdź połączenie z internetem.');
else if (!window.MODELE) blad('Brak danych modeli (docs/dane_*.js) — uruchom generatory.');
else start();

function start() {
  const stan = { model: 'brelok', kam: 'iso', zegarek: true, ladowarka: false, klapka: true, rozloz: false,
                 przekroj: false, wymiary: true, wariant: 'TPU', studio: false, zoom: 1 };
  const hp = new URLSearchParams(location.hash.slice(1));
  for (const k of Object.keys(stan)) {
    if (!hp.has(k)) continue;
    const v = hp.get(k);
    stan[k] = typeof stan[k] === 'boolean' ? v === '1' : typeof stan[k] === 'number' ? parseFloat(v) || 1 : v;
  }
  if (!KONFIG[stan.model]) stan.model = 'brelok';
  if (stan.studio) document.body.classList.add('studio');
  document.getElementById('repo').href = REPO;

  const scena = document.getElementById('scena'), svg = document.getElementById('wymiary');
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.localClippingEnabled = true;
  scena.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0A0B0D);
  scene.fog = new THREE.Fog(0x0A0B0D, 180, 520);
  const camera = new THREE.PerspectiveCamera(30, 1, 1, 5000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;

  scene.add(new THREE.HemisphereLight(0xe6ecff, 0x1c1f24, 0.58));
  // światło "z kamery" - każdy widok (także tył) oświetlony tak samo, neutralnie
  const glowne = new THREE.DirectionalLight(0xffffff, 0.9);
  glowne.position.set(70, 90, 0);
  glowne.target.position.set(0, 0, -100);
  camera.add(glowne, glowne.target);
  scene.add(camera);
  const gora = new THREE.DirectionalLight(0xffffff, 0.22); gora.position.set(40, 220, 60); scene.add(gora);
  const kontur = new THREE.DirectionalLight(0xbfe6ff, 0.3); kontur.position.set(-80, 120, -230); scene.add(kontur);
  const siatkaPodlogi = new THREE.GridHelper(720, 72, 0x232830, 0x14171b);
  scene.add(siatkaPodlogi);

  const ciecie = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);   // przekrój: zostaje połowa x <= 0
  const loader = new THREE.STLLoader();
  const buf = b64 => { const s = atob(b64), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u.buffer; };
  const siatki = {};
  function zbuduj(model) {
    if (siatki[model]) return siatki[model];
    const k = KONFIG[model], d = MODELE[model], m = {};
    for (const [nazwa, c] of Object.entries(k.czesci)) {
      if (!d.czesci[nazwa]) continue;
      const mat = new THREE.MeshStandardMaterial({ color: c.kolor, roughness: c.rough, metalness: c.metal, side: THREE.DoubleSide });
      mat.fog = false;
      const g = loader.parse(buf(d.czesci[nazwa]));
      g.computeBoundingBox();
      const mesh = new THREE.Mesh(g, mat);
      mesh.userData = c;
      scene.add(mesh);
      m[nazwa] = mesh;
    }
    return (siatki[model] = m);
  }

  function przycisk(rodzic, tekst, klik) {
    const b = document.createElement('button');
    b.textContent = tekst; b.onclick = klik; rodzic.appendChild(b); return b;
  }

  function ui() {
    const k = KONFIG[stan.model], r = MODELE[stan.model].raport;
    document.querySelectorAll('#modele button').forEach(b => b.classList.toggle('on', b.dataset.model === stan.model));
    document.getElementById('karta').innerHTML =
      `<div class="kod">${k.kod} / ${k.skrot}</div><h1>${k.nazwa}</h1><p>${k.opis}</p>` +
      `<dl>${k.spec(r, stan).map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>` +
      `<div class="linki"><a class="btn" target="_blank" rel="noopener" href="${REPO}/tree/main/${stan.model}">readme ↗</a>` +
      `<a class="btn" target="_blank" rel="noopener" href="${REPO}/tree/main/${stan.model}/stl">pliki stl ↗</a></div>`;
    document.getElementById('etykieta').innerHTML =
      `<div class="kod">${k.kod} / ${k.skrot}</div><div class="nazwa">${k.nazwa}</div><div class="spec">${k.linia(r, stan)}</div>`;
    const p = document.getElementById('przelaczniki');
    p.innerHTML = '';
    for (const nazwa of k.przelaczniki) {
      if (nazwa === 'wariant') { przycisk(p, 'wariant · ' + stan.wariant, () => { stan.wariant = stan.wariant === 'TPU' ? 'PETG' : 'TPU'; odswiez(); }); continue; }
      przycisk(p, NAZWY[nazwa], () => {
        stan[nazwa] = !stan[nazwa];
        if (nazwa === 'przekroj' && stan.przekroj) { stan.rozloz = false; ustawKamere('bok'); }
        if (nazwa === 'rozloz' && stan.rozloz) stan.przekroj = false;
        odswiez();
      }).classList.toggle('on', !!stan[nazwa]);
    }
    document.querySelectorAll('#kamery button').forEach(b => b.classList.toggle('on', b.dataset.kam === stan.kam));
  }

  function odswiez() {
    zbuduj(stan.model);
    for (const [model, m] of Object.entries(siatki)) {
      for (const mesh of Object.values(m)) {
        const c = mesh.userData;
        let v = model === stan.model;
        if (c.typ === 'zegarek') v = v && stan.zegarek;
        if (c.typ === 'ladowarka') v = v && stan.ladowarka;
        if (c.typ === 'klapka') v = v && stan.klapka;
        if (c.wariant) v = v && c.wariant === stan.wariant;
        mesh.visible = v;
        mesh.position.set(...(stan.rozloz && c.ex ? c.ex : [0, 0, 0]));
        mesh.material.clippingPlanes = stan.przekroj ? [ciecie] : [];
        mesh.material.needsUpdate = true;
      }
    }
    siatkaPodlogi.position.y = KONFIG[stan.model].podloga;
    ui();
    const h = new URLSearchParams();
    for (const [a, b] of Object.entries(stan)) if (a !== 'studio' && a !== 'zoom') h.set(a, typeof b === 'boolean' ? +b : b);
    history.replaceState(null, '', '#' + h.toString());
  }

  function ustawKamere(nazwa) {
    const k = KONFIG[stan.model];
    stan.kam = KAMERY[nazwa] || nazwa === 'tyl34' ? nazwa : 'iso';
    const cel = new THREE.Vector3(...k.cel), poz = new THREE.Vector3(...k.kamery[stan.kam]);
    const daleko = (camera.aspect < 0.8 ? 1.55 : 1) / (stan.zoom || 1);
    camera.position.copy(poz.sub(cel).multiplyScalar(daleko).add(cel));
    controls.target.copy(cel);
    controls.update();
    const d = camera.position.distanceTo(cel);
    scene.fog.near = d * 0.8; scene.fog.far = d * 2.1;
    document.querySelectorAll('#kamery button').forEach(b => b.classList.toggle('on', b.dataset.kam === stan.kam));
  }

  function pudelko() {
    const b = new THREE.Box3();
    let jest = false;
    for (const mesh of Object.values(siatki[stan.model] || {})) {
      if (!mesh.visible || (mesh.userData.typ !== 'ramka' && mesh.userData.typ !== 'klapka')) continue;
      b.union(mesh.geometry.boundingBox.clone().translate(mesh.position)); jest = true;
    }
    return jest ? b : null;
  }

  function rysujWymiary() {
    const W = window.innerWidth, H = window.innerHeight;
    const pokaz = stan.wymiary && !stan.przekroj && !stan.rozloz && camera.position.z > controls.target.z + 30;
    const b = pokaz ? pudelko() : null;
    if (!b) { if (svg.childElementCount) svg.innerHTML = ''; return; }
    const P = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
    const sr = b.getCenter(new THREE.Vector3()), C = P(sr.x, sr.y, sr.z), o = 6;
    const odc = [
      [[b.min.x, b.min.y, b.max.z], [b.max.x, b.min.y, b.max.z], [0, -o, 0], b.max.x - b.min.x],
      [[b.min.x, b.min.y, b.max.z], [b.min.x, b.max.y, b.max.z], [-o, 0, 0], b.max.y - b.min.y],
      [[b.max.x, b.min.y, b.min.z], [b.max.x, b.min.y, b.max.z], [o * 0.7, -o * 0.7, 0], b.max.z - b.min.z],
    ];
    let s = '';
    for (const [a3, e3, d, val] of odc) {
      const a0 = P(...a3), e0 = P(...e3);
      const a = P(a3[0] + d[0], a3[1] + d[1], a3[2] + d[2]), e = P(e3[0] + d[0], e3[1] + d[1], e3[2] + d[2]);
      const dx = e[0] - a[0], dy = e[1] - a[1], L = Math.hypot(dx, dy) || 1;
      let nx = -dy / L, ny = dx / L;
      const mx = (a[0] + e[0]) / 2, my = (a[1] + e[1]) / 2;
      if ((mx - C[0]) * nx + (my - C[1]) * ny < 0) { nx = -nx; ny = -ny; }
      s += `<line class="pom" x1="${a0[0]}" y1="${a0[1]}" x2="${a[0]}" y2="${a[1]}"/><line class="pom" x1="${e0[0]}" y1="${e0[1]}" x2="${e[0]}" y2="${e[1]}"/>`;
      s += `<line x1="${a[0]}" y1="${a[1]}" x2="${e[0]}" y2="${e[1]}"/>`;
      for (const q of [a, e]) s += `<line x1="${q[0] - nx * 4}" y1="${q[1] - ny * 4}" x2="${q[0] + nx * 4}" y2="${q[1] + ny * 4}"/>`;
      s += `<text x="${mx + nx * 15}" y="${my + ny * 15}" text-anchor="middle" dominant-baseline="central">${fmt(val)}</text>`;
    }
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML = s;
  }

  document.querySelectorAll('#modele button').forEach(b => b.onclick = () => {
    stan.model = b.dataset.model; stan.przekroj = false; stan.rozloz = false;
    odswiez(); ustawKamere('iso');
  });
  const kam = document.getElementById('kamery');
  for (const [k, t] of Object.entries(KAMERY)) przycisk(kam, t, () => ustawKamere(k)).dataset.kam = k;

  function rozmiar() {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', rozmiar);
  rozmiar();
  odswiez();
  ustawKamere(stan.kam);
  (function petla() { controls.update(); renderer.render(scene, camera); rysujWymiary(); requestAnimationFrame(petla); })();
}
